[project]
name = "top-engineers"
version = "0.1.0"
description = "Rank engineers on how their fix/bug work landed, not how much of it there was."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
top-engineers = "top_engineers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/top_engineers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
